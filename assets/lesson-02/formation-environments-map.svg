<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">宝石主要形成环境图</title>
  <desc id="desc">展示岩浆作用、变质作用、热液作用、沉积风化和生物成因五类宝石形成环境。</desc>
  <rect width="1200" height="900" fill="#fbf8f2"/>
  <text x="600" y="70" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#2d2520">宝石主要形成环境</text>
  <text x="600" y="112" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#675b50">形成条件复杂，不等于每一颗都高价值</text>

  <g font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="90" y="175" width="300" height="210" rx="26" fill="#ffe8d5" stroke="#d9824b" stroke-width="3"/>
    <text x="240" y="225" text-anchor="middle" font-size="32" font-weight="700" fill="#8a3f1f">岩浆作用</text>
    <path d="M205 330 C210 285, 235 270, 240 245 C260 280, 285 300, 278 342 C270 374, 220 374, 205 330 Z" fill="#e77242"/>
    <text x="240" y="415" text-anchor="middle" font-size="22" fill="#2d2520">高温、深部、结晶</text>
    <text x="240" y="450" text-anchor="middle" font-size="20" fill="#675b50">例：钻石、部分橄榄石</text>

    <rect x="450" y="175" width="300" height="210" rx="26" fill="#eadff7" stroke="#8d6fb2" stroke-width="3"/>
    <text x="600" y="225" text-anchor="middle" font-size="32" font-weight="700" fill="#5c3e82">变质作用</text>
    <polygon points="535,330 600,255 665,330 600,372" fill="#c7afd9" stroke="#765399" stroke-width="4"/>
    <path d="M555 330 H645 M575 300 H625" stroke="#765399" stroke-width="5"/>
    <text x="600" y="415" text-anchor="middle" font-size="22" fill="#2d2520">温度、压力、流体</text>
    <text x="600" y="450" text-anchor="middle" font-size="20" fill="#675b50">例：红蓝宝、翡翠</text>

    <rect x="810" y="175" width="300" height="210" rx="26" fill="#e0f3f2" stroke="#6aaca8" stroke-width="3"/>
    <text x="960" y="225" text-anchor="middle" font-size="32" font-weight="700" fill="#286661">热液作用</text>
    <path d="M900 350 C940 300, 980 295, 1025 250" fill="none" stroke="#4a9994" stroke-width="8" stroke-linecap="round"/>
    <circle cx="930" cy="330" r="16" fill="#9fd8d4"/>
    <circle cx="980" cy="292" r="12" fill="#9fd8d4"/>
    <text x="960" y="415" text-anchor="middle" font-size="22" fill="#2d2520">热流体迁移沉淀</text>
    <text x="960" y="450" text-anchor="middle" font-size="20" fill="#675b50">例：祖母绿、水晶</text>

    <rect x="230" y="540" width="330" height="210" rx="26" fill="#efe6d4" stroke="#ad8a58" stroke-width="3"/>
    <text x="395" y="590" text-anchor="middle" font-size="32" font-weight="700" fill="#6d4d23">沉积与风化</text>
    <path d="M290 690 C360 640, 430 720, 500 665" fill="none" stroke="#9b7442" stroke-width="9" stroke-linecap="round"/>
    <circle cx="355" cy="675" r="12" fill="#d5b47d"/>
    <circle cx="425" cy="690" r="10" fill="#d5b47d"/>
    <text x="395" y="780" text-anchor="middle" font-size="22" fill="#2d2520">搬运、保存、富集</text>
    <text x="395" y="815" text-anchor="middle" font-size="20" fill="#675b50">例：砂矿钻石、红蓝宝</text>

    <rect x="640" y="540" width="330" height="210" rx="26" fill="#f6e4ea" stroke="#bd7f95" stroke-width="3"/>
    <text x="805" y="590" text-anchor="middle" font-size="32" font-weight="700" fill="#7c4058">生物成因</text>
    <ellipse cx="805" cy="665" rx="70" ry="45" fill="#f3c5d5" stroke="#a75d78" stroke-width="4"/>
    <circle cx="805" cy="665" r="18" fill="#fff9ee" stroke="#c49c63" stroke-width="3"/>
    <text x="805" y="780" text-anchor="middle" font-size="22" fill="#2d2520">与生物活动有关</text>
    <text x="805" y="815" text-anchor="middle" font-size="20" fill="#675b50">例：珍珠、珊瑚、琥珀</text>

    <rect x="160" y="820" width="880" height="50" rx="18" fill="#fffdf8" stroke="#d5c4af" stroke-width="2"/>
    <text x="600" y="853" text-anchor="middle" font-size="22" font-weight="700" fill="#4d443d">消费提醒：形成故事不能替代品质、证书、预算和复检</text>
  </g>
</svg>
