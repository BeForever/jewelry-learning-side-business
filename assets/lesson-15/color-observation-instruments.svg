<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">颜色观察工具入门</title>
  <desc id="desc">第 15 课教学图</desc>
  <rect width="1200" height="820" fill="#fbf8f2"/>
  <text x="600" y="75" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#2d2520">颜色观察工具入门</text>
  <text x="600" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#675b50">二色镜、分光镜、滤色镜都是辅助工具</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="80" y="210" width="320" height="390" rx="28" fill="#eaf3f7" stroke="#8bb8ca" stroke-width="3"/>
    <text x="240" y="275" text-anchor="middle" font-size="32" font-weight="700" fill="#24576a">二色镜</text>
    <circle cx="240" cy="382" r="58" fill="#ffffff" stroke="#8bb8ca" stroke-width="4"/>
    <text x="240" y="394" text-anchor="middle" font-size="40" font-weight="700" fill="#24576a">1</text>
    <text x="240" y="500" text-anchor="middle" font-size="23" fill="#2d2520">看多色性</text>
    <text x="240" y="545" text-anchor="middle" font-size="20" fill="#675b50">方向要正确</text><rect x="440" y="210" width="320" height="390" rx="28" fill="#fff2df" stroke="#d79a62" stroke-width="3"/>
    <text x="600" y="275" text-anchor="middle" font-size="32" font-weight="700" fill="#8a4f22">分光镜</text>
    <circle cx="600" cy="382" r="58" fill="#ffffff" stroke="#d79a62" stroke-width="4"/>
    <text x="600" y="394" text-anchor="middle" font-size="40" font-weight="700" fill="#8a4f22">2</text>
    <text x="600" y="500" text-anchor="middle" font-size="23" fill="#2d2520">看吸收谱</text>
    <text x="600" y="545" text-anchor="middle" font-size="20" fill="#675b50">需训练</text><rect x="800" y="210" width="320" height="390" rx="28" fill="#eef6ed" stroke="#8dbb87" stroke-width="3"/>
    <text x="960" y="275" text-anchor="middle" font-size="32" font-weight="700" fill="#3f6b37">滤色镜</text>
    <circle cx="960" cy="382" r="58" fill="#ffffff" stroke="#8dbb87" stroke-width="4"/>
    <text x="960" y="394" text-anchor="middle" font-size="40" font-weight="700" fill="#3f6b37">3</text>
    <text x="960" y="500" text-anchor="middle" font-size="23" fill="#2d2520">看颜色反应</text>
    <text x="960" y="545" text-anchor="middle" font-size="20" fill="#675b50">不能单独判断</text>
    <rect x="140" y="690" width="920" height="58" rx="20" fill="#fffdf8" stroke="#d5c4af" stroke-width="2"/>
    <text x="600" y="728" text-anchor="middle" font-size="23" font-weight="700" fill="#4d443d">学习边界：观察、仪器和证书都要放进证据链，不做绝对结论</text>
  </g>
</svg>
