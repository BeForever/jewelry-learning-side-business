<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">三大岩类与宝石关系</title>
  <desc id="desc">第 5 课教学图</desc>
  <rect width="1200" height="820" fill="#fbf8f2"/>
  <text x="600" y="75" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#2d2520">三大岩类与宝石关系</text>
  <text x="600" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#675b50">岩石是地质背景，矿物才常是宝石材料</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="80" y="210" width="320" height="390" rx="28" fill="#eaf3f7" stroke="#8bb8ca" stroke-width="3"/>
    <text x="240" y="275" text-anchor="middle" font-size="34" font-weight="700" fill="#24576a">岩浆岩</text>
    <circle cx="240" cy="385" r="58" fill="#ffffff" stroke="#8bb8ca" stroke-width="4"/>
    <text x="240" y="395" text-anchor="middle" font-size="42" font-weight="700" fill="#24576a">1</text>
    <text x="240" y="500" text-anchor="middle" font-size="24" fill="#2d2520">岩浆冷却结晶</text>
    <text x="240" y="545" text-anchor="middle" font-size="21" fill="#675b50">例：花岗岩、玄武岩背景</text><rect x="440" y="210" width="320" height="390" rx="28" fill="#fff2df" stroke="#d79a62" stroke-width="3"/>
    <text x="600" y="275" text-anchor="middle" font-size="34" font-weight="700" fill="#8a4f22">沉积岩</text>
    <circle cx="600" cy="385" r="58" fill="#ffffff" stroke="#d79a62" stroke-width="4"/>
    <text x="600" y="395" text-anchor="middle" font-size="42" font-weight="700" fill="#8a4f22">2</text>
    <text x="600" y="500" text-anchor="middle" font-size="24" fill="#2d2520">风化搬运沉积</text>
    <text x="600" y="545" text-anchor="middle" font-size="21" fill="#675b50">例：砂矿富集、琥珀背景</text><rect x="800" y="210" width="320" height="390" rx="28" fill="#eef6ed" stroke="#8dbb87" stroke-width="3"/>
    <text x="960" y="275" text-anchor="middle" font-size="34" font-weight="700" fill="#3f6b37">变质岩</text>
    <circle cx="960" cy="385" r="58" fill="#ffffff" stroke="#8dbb87" stroke-width="4"/>
    <text x="960" y="395" text-anchor="middle" font-size="42" font-weight="700" fill="#3f6b37">3</text>
    <text x="960" y="500" text-anchor="middle" font-size="24" fill="#2d2520">温度压力改造</text>
    <text x="960" y="545" text-anchor="middle" font-size="21" fill="#675b50">例：红蓝宝、翡翠背景</text>
    <rect x="160" y="690" width="880" height="58" rx="20" fill="#fffdf8" stroke="#d5c4af" stroke-width="2"/>
    <text x="600" y="728" text-anchor="middle" font-size="24" font-weight="700" fill="#4d443d">学习边界：观察描述不能替代证书、复检和专业判断</text>
  </g>
</svg>
