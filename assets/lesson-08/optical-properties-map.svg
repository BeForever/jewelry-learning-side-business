<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">宝石光学性质入门</title>
  <desc id="desc">第 8 课教学图</desc>
  <rect width="1200" height="820" fill="#fbf8f2"/>
  <text x="600" y="75" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#2d2520">宝石光学性质入门</text>
  <text x="600" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#675b50">光怎么进入、反射、折射，会影响宝石外观</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="80" y="210" width="320" height="390" rx="28" fill="#eaf3f7" stroke="#8bb8ca" stroke-width="3"/>
    <text x="240" y="275" text-anchor="middle" font-size="34" font-weight="700" fill="#24576a">透明度</text>
    <circle cx="240" cy="385" r="58" fill="#ffffff" stroke="#8bb8ca" stroke-width="4"/>
    <text x="240" y="395" text-anchor="middle" font-size="42" font-weight="700" fill="#24576a">1</text>
    <text x="240" y="500" text-anchor="middle" font-size="24" fill="#2d2520">透光程度</text>
    <text x="240" y="545" text-anchor="middle" font-size="21" fill="#675b50">透明/半透明/不透明</text><rect x="440" y="210" width="320" height="390" rx="28" fill="#fff2df" stroke="#d79a62" stroke-width="3"/>
    <text x="600" y="275" text-anchor="middle" font-size="34" font-weight="700" fill="#8a4f22">折射</text>
    <circle cx="600" cy="385" r="58" fill="#ffffff" stroke="#d79a62" stroke-width="4"/>
    <text x="600" y="395" text-anchor="middle" font-size="42" font-weight="700" fill="#8a4f22">2</text>
    <text x="600" y="500" text-anchor="middle" font-size="24" fill="#2d2520">光线改变方向</text>
    <text x="600" y="545" text-anchor="middle" font-size="21" fill="#675b50">影响亮度与火彩</text><rect x="800" y="210" width="320" height="390" rx="28" fill="#eef6ed" stroke="#8dbb87" stroke-width="3"/>
    <text x="960" y="275" text-anchor="middle" font-size="34" font-weight="700" fill="#3f6b37">双折射/多色性</text>
    <circle cx="960" cy="385" r="58" fill="#ffffff" stroke="#8dbb87" stroke-width="4"/>
    <text x="960" y="395" text-anchor="middle" font-size="42" font-weight="700" fill="#3f6b37">3</text>
    <text x="960" y="500" text-anchor="middle" font-size="24" fill="#2d2520">方向相关表现</text>
    <text x="960" y="545" text-anchor="middle" font-size="21" fill="#675b50">需仪器辅助观察</text>
    <rect x="160" y="690" width="880" height="58" rx="20" fill="#fffdf8" stroke="#d5c4af" stroke-width="2"/>
    <text x="600" y="728" text-anchor="middle" font-size="24" font-weight="700" fill="#4d443d">学习边界：观察描述不能替代证书、复检和专业判断</text>
  </g>
</svg>
