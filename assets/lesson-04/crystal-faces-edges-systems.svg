<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">晶面、晶棱、晶体和七大晶系</title>
  <desc id="desc">展示晶面、晶棱和晶体的基本部位，并列出七大晶系入门记忆。</desc>
  <rect width="1200" height="900" fill="#fbf8f2"/>
  <text x="600" y="70" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700" fill="#2d2520">晶面、晶棱、晶系入门</text>
  <text x="600" y="112" text-anchor="middle" font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#675b50">先会描述形态，再慢慢理解结构</text>
  <g font-family="Noto Sans CJK SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="80" y="165" width="500" height="620" rx="28" fill="#eef6ed" stroke="#8dbb87" stroke-width="3"/>
    <text x="330" y="220" text-anchor="middle" font-size="34" font-weight="700" fill="#3f6b37">晶体部位</text>
    <polygon points="250,360 385,300 470,385 330,455" fill="#b7d8b1" stroke="#3f6b37" stroke-width="4"/>
    <polygon points="250,360 330,455 330,610 250,515" fill="#9fcf98" stroke="#3f6b37" stroke-width="4"/>
    <polygon points="330,455 470,385 470,535 330,610" fill="#c9e3c4" stroke="#3f6b37" stroke-width="4"/>
    <line x1="250" y1="360" x2="470" y2="535" stroke="#8a4f22" stroke-width="7"/>
    <circle cx="470" cy="385" r="10" fill="#8a4f22"/>
    <text x="180" y="335" font-size="24" font-weight="700" fill="#3f6b37">晶面：平整外表面</text>
    <text x="155" y="565" font-size="24" font-weight="700" fill="#8a4f22">晶棱：两个晶面交线</text>
    <text x="360" y="675" font-size="24" font-weight="700" fill="#4d443d">晶形：整体外形</text>

    <rect x="620" y="165" width="500" height="620" rx="28" fill="#f3edf8" stroke="#a98cc4" stroke-width="3"/>
    <text x="870" y="220" text-anchor="middle" font-size="34" font-weight="700" fill="#5c3e82">七大晶系速记</text>
    <g font-size="24" fill="#2d2520">
      <rect x="690" y="275" width="360" height="46" rx="14" fill="#ffffff" stroke="#d3c2e2"/><text x="720" y="306">等轴晶系：三轴等长</text>
      <rect x="690" y="340" width="360" height="46" rx="14" fill="#ffffff" stroke="#d3c2e2"/><text x="720" y="371">四方晶系：两轴等长</text>
      <rect x="690" y="405" width="360" height="46" rx="14" fill="#ffffff" stroke="#d3c2e2"/><text x="720" y="436">斜方晶系：三轴不等</text>
      <rect x="690" y="470" width="360" height="46" rx="14" fill="#ffffff" stroke="#d3c2e2"/><text x="720" y="501">单斜晶系：一个斜角</text>
      <rect x="690" y="535" width="360" height="46" rx="14" fill="#ffffff" stroke="#d3c2e2"/><text x="720" y="566">三斜晶系：三个斜角</text>
      <rect x="690" y="600" width="360" height="46" rx="14" fill="#ffffff" stroke="#d3c2e2"/><text x="720" y="631">六方晶系：六方对称</text>
      <rect x="690" y="665" width="360" height="46" rx="14" fill="#ffffff" stroke="#d3c2e2"/><text x="720" y="696">三方晶系：三方对称</text>
    </g>
    <rect x="180" y="820" width="840" height="50" rx="18" fill="#fffdf8" stroke="#d5c4af" stroke-width="2"/>
    <text x="600" y="853" text-anchor="middle" font-size="22" font-weight="700" fill="#4d443d">消费提醒：晶形像不像，不能单独判断真假、产地或价值</text>
  </g>
</svg>
